<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Access — AI Labs by Nimbus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6459e8;
      --primary-bright: #7c72ff;
      --secondary: #a855f7;
      --accent: #f43f5e;
      --black: #020016;
      --bg-deep: #05021a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      background-color: var(--black);
      color: var(--text-main);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
    }

    .login-shell {
      width: 100%;
      max-width: 460px;
      position: relative;
    }

    .login-card {
      position: relative;
      background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0;
      padding: 40px 36px 36px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    }

    .login-kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--primary-bright);
      margin-bottom: 14px;
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: clamp(26px, 6vw, 34px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .login-sub {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .field-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 9px;
    }

    .field-wrap { position: relative; margin-bottom: 18px; }

    .field-input {
      width: 100%;
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text-main);
      background: rgba(2, 0, 22, 0.85);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 0;
      padding: 14px 16px;
      padding-right: 92px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-input::placeholder { color: #475569; }

    .field-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow, rgba(100,89,232,0.3));
    }

    .reveal-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 0;
      padding: 7px 10px;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .reveal-btn:hover { color: var(--primary-bright); border-color: var(--primary); }

    .submit-btn {
      width: 100%;
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 0;
      padding: 15px 20px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.12s ease;
    }

    .submit-btn:hover:not(:disabled) { background: var(--primary-bright); }
    .submit-btn:active:not(:disabled) { transform: translateY(1px); }
    .submit-btn:disabled { opacity: 0.55; cursor: progress; }

    .submit-btn:focus-visible,
    .reveal-btn:focus-visible {
      outline: 2px solid var(--primary-bright);
      outline-offset: 2px;
    }

    .status {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.55;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 0;
      display: none;
    }

    .status.is-visible { display: block; }
    .status.is-error { color: #fecdd3; background: rgba(244,63,94,0.1); border-color: rgba(244,63,94,0.35); }
    .status.is-info { color: #c7d2fe; background: rgba(100,89,232,0.1); border-color: rgba(100,89,232,0.35); }

    .login-foot {
      margin-top: 22px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-align: center;
    }

    .login-foot a { color: var(--text-muted); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.2); }
    .login-foot a:hover { color: var(--primary-bright); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <p class="login-kicker">// Nimbus Control Plane</p>
      <h1 class="login-title" id="login-title">Admin Access</h1>
      <p class="login-sub">Authenticate to open the CMS Matrix. Sessions expire after 8 hours and are bound to this browser.</p>

      <form id="login-form" novalidate>
        <label class="field-label" for="password">Passphrase</label>
        <div class="field-wrap">
          <input
            class="field-input"
            id="password"
            name="password"
            type="password"
            placeholder="Enter admin passphrase"
            autocomplete="current-password"
            spellcheck="false"
            required
            autofocus>
          <button class="reveal-btn" id="reveal-btn" type="button" aria-label="Show passphrase">Show</button>
        </div>

        <button class="submit-btn" id="submit-btn" type="submit">Enter Matrix</button>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="login-foot"><a href="/">Return to site</a></p>
    </section>
  </main>

  <script src="/login.js"></script>
</body>
</html>
