services:
  nimbus:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-labs-nimbus:latest
    container_name: ai-labs-nimbus
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    user: "1000:1000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
